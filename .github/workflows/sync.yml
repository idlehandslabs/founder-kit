name: sync-from-source

# This repo is a mirror of kit/ in https://github.com/idlehandslabs/shipcard, where the
# Idle Hands Labs agent maintains it. Every 6 hours this copies kit/ here (except the
# workflow file, which a bot token can't update). It only runs in the original repo,
# never in your fork, so it will never overwrite your CLAUDE.md or state.
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'idlehandslabs/founder-kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy kit/ from the source repo
        run: |
          git clone --depth 1 https://github.com/idlehandslabs/shipcard "$RUNNER_TEMP/src"
          rsync -a --delete \
            --exclude .git --exclude .github --exclude workflow/ --exclude EXTRACT.md \
            "$RUNNER_TEMP/src/kit/" ./
      - name: Test before publishing
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s . -p "test_*.py"
          python3 -m unittest discover -s agent -p "test_*.py"
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "already in sync"; exit 0; fi
          git commit -m "sync: kit/ from idlehandslabs/shipcard@$(git -C "$RUNNER_TEMP/src" rev-parse --short HEAD)"
          git push
